language: "ko-KR"
reviews:
  auto_review:
    enabled: true
    drafts: false
  review_status: true
  profile: "assertive"
  request_changes_workflow: true
  high_level_summary: true
  poem: false
  collapse_walkthrough: true
  path_instructions:
    - path: "**/*.java"
      instructions: |
        코드 리뷰 시 아래 항목을 확인하고, 문제가 있으면 원인 설명과 함께 개선된 코드 예시를 제시해주세요.
        - N+1 쿼리 문제: fetch join 또는 @EntityGraph 사용 권장
        - @Transactional 누락 또는 잘못된 사용
        - 생성자 주입 대신 @Autowired 필드 주입 사용
        - ApiResponse 래퍼 미사용
        - CustomException 대신 일반 예외 사용
        - 불필요한 반복 DB 조회 (EntityFinder 활용 권장)
        - 보안 취약점 (SQL Injection, XSS 등)
        - 성능 개선 가능한 쿼리 또는 로직
